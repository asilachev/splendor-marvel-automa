# Example deployment. Put it behind a reverse proxy that terminates HTTPS:
# PWA install, offline mode and the screen wake lock need a secure context.
services:
  thanos-automa:
    image: ghcr.io/asilachev/splendor-marvel-automa:latest
    # To build from a checkout instead of pulling the published image:
    # build: .
    restart: unless-stopped
    ports:
      - '8080:8080'
