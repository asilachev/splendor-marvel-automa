name: Pages

# The landing page (site/) on GitHub Pages: https://asilachev.github.io/splendor-marvel-automa/
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/guide/screenshots/**'
      - 'src/ui/assets/fonts/**'
      - 'public/favicon.svg'
      - 'public/pwa-512x512.png'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
