# Serves the static PWA build. TLS is expected to terminate at your reverse proxy.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  # Content-hashed build output never changes: cache for a year.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker and manifest must always be revalidated so updates reach players.
  location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
    types {
      application/javascript js;
      application/manifest+json webmanifest;
    }
    try_files $uri =404;
  }

  # App shell and static files; unknown paths fall back to the single-page app.
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
